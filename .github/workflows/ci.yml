name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: steply_test
          POSTGRES_USER: steply_test
          POSTGRES_PASSWORD: steply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steply_test -d steply_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://steply_test:steply_test@localhost:5432/steply_test
      ENVIRONMENT: local
      AUTO_INIT_DB: "false"
      SECRET_KEY: ci-secret-key-only-for-tests
      BACKEND_CORS_ORIGINS: http://localhost:5173
      BACKEND_CORS_ORIGIN_REGEX: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t steply-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t steply-frontend:ci ./frontend
