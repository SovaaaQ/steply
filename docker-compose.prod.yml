services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - steply_postgres_data:/var/lib/postgresql/data
    networks:
      - steply_private
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-Steply}
      ENVIRONMENT: production
      AUTO_INIT_DB: "false"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?set BACKEND_CORS_ORIGINS}
      BACKEND_CORS_ORIGIN_REGEX: ""
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-bothub}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-12}
      AI_DAILY_RECOMMENDATION_LIMIT: ${AI_DAILY_RECOMMENDATION_LIMIT:-5}
      BOTHUB_API_KEY: ${BOTHUB_API_KEY:-}
      BOTHUB_BASE_URL: ${BOTHUB_BASE_URL:-https://openai.bothub.chat/v1}
      BOTHUB_MODEL: ${BOTHUB_MODEL:-gpt-5.4-mini}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - steply_private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - steply_private
      - steply_public
    restart: unless-stopped


volumes:
  steply_postgres_data:

networks:
  steply_private:
    driver: bridge
  steply_public:
    driver: bridge
